{# Market strip: TradingView's free ticker widget. Symbols live in site.yml. #}
{% if site.ticker %}
<div class="ticker" aria-label="Market prices">
  <div class="tradingview-widget-container" id="ticker-widget"><div class="tradingview-widget-container__widget"></div><div class="tradingview-widget-copyright"><a href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank">Market data by TradingView</a></div></div>
  <script>
  (function () {
    var items = {{ site.ticker | tojson }};
    var s = document.createElement("script");
    s.src = "https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js";
    s.async = true;
    s.innerHTML = JSON.stringify({
      symbols: items.map(function (t) { return { proName: t.symbol, title: t.label }; }),
      showSymbolLogo: false,
      isTransparent: true,
      displayMode: "compact",
      colorTheme: "dark",
      locale: "en"
    });
    document.getElementById("ticker-widget").appendChild(s);
  })();
  </script>
</div>
{% endif %}
