# ─── Site settings ──────────────────────────────────────────────
# Edit these, then run:  python build.py
title: Sean Lu
tagline: The world through a market lens.
intro: >-
  I started this site to document my ideas, philosophies and, inevitably, my 
  mistakes. Here I'll share whatever is capturing my curiosity in markets, the 
  trades it leads to, and what each one teaches me. I hope it's an evolving 
  record of how I see the world and a way to understand who I am as an investor.
description: >-
  Macro trade ideas and post-mortems by Sean Lu — rates, FX and cross-asset
  views, each with an explicit entry, stop, target and an honest review.
author: Sean Lu
# Full URL of the live site, no trailing slash. Used for canonical links,
# the sitemap and the RSS feed.
url: https://seanlu-macro.github.io
# Leave empty if the site lives at the root of a domain
# (yourname.github.io or a custom domain). Set to "/repo-name" only if you
# publish from a project repository at yourname.github.io/repo-name.
base_path: ""
email: "seanlu@berkeley.edu"                  # optional, shown in the footer if set
linkedin: "www.linkedin.com/in/lu-sean"       # optional, full URL
x: ""              # optional, full URL
disclaimer: >-
  Views are my own and for educational purposes only. Positions are
  hypothetical. Nothing here is investment advice.

# ─── Market strip ───────────────────────────────────────────────
# Live prices across the top of every page (TradingView's free ticker
# widget). Delete the whole list to remove the strip.
ticker:
  - { symbol: "FOREXCOM:SPXUSD", label: "S&P 500" }
  - { symbol: "FOREXCOM:NSXUSD", label: "Nasdaq 100" }
  - { symbol: "FRED:DGS10",      label: "US 10Y yield" }
  - { symbol: "CAPITALCOM:DXY",  label: "Dollar (DXY)" }
  - { symbol: "TVC:USOIL",       label: "WTI oil" }
  - { symbol: "TVC:GOLD",        label: "Gold" }